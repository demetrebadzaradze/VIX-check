services:
  fearmeter:
    build: .
    container_name: FearMeter
    restart: unless-stopped
    environment:
      TZ: UTC
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
    volumes:
      - vix-data:/data
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

volumes:
  vix-data:
